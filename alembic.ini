# Alembic configuration for CTO Copilot (2-table schema: pull_requests, engineers).
# NOTE: sqlalchemy.url below is only a placeholder — alembic/env.py always
# overrides it from app settings (.env), converting the async aiomysql
# driver URL into the sync pymysql URL Alembic needs.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url = mysql+pymysql://cto_user:cto_password_2026@mysql:3306/cto_copilot_db?charset=utf8mb4

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
